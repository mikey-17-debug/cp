# =====================================================================
# 英文 IMDb 电影类型分类（bert-base-uncased）训练配置
# 说明：
#   * 数据源为 HuggingFace datasets 落盘的 Arrow 目录（BrightData/IMDb-Media）
#   * 所有相对路径都以本文件所在目录（项目根目录）为基准解析
#   * 与中文 config.yaml 完全隔离：独立输出目录、独立切分文件
# =====================================================================

data:
  # 数据源类型：arrow（HuggingFace datasets 落盘目录）
  source: "arrow"
  # 相对项目根目录：P1/T1/imdb_media_dataset
  path: "../../T1/imdb_media_dataset"
  # 报告展示名
  display_name: "IMDb 英文电影"
  # 该数据集只有 train 一个 split，训练/验证/测试由本项目重新切分
  arrow_split: "train"
  # 类型列：IMDb 的 genres，形如 ["History", "Drama"]
  label_column: "genres"
  # 送入模型的文本列名（由下面的模板生成）
  text_column: "summary"
  # 片名 + 剧情简介；剧情简介缺失时回退到 presentation / title
  text_template: "{title}. {storyline}"
  fallback_text_fields: ["presentation", "title"]
  # 只保留题材类，剔除载体/节目形态标签
  exclude_labels:
    - "Short"
    - "Documentary"
    - "Adult"
    - "News"
    - "Reality-TV"
    - "Talk-Show"
    - "Game-Show"
  # 单标签只取主类型（genres 首项），不再展开，避免同一文本对应多个矛盾标签
  single_label_strategy: "primary"
  min_label_count: 10
  drop_duplicated: true
  missing_text: ""
  limit: null
  export_splits: true
  # 与中文切分文件分开，避免覆盖 dataset/splits
  export_dir: "dataset/imdb_splits"
  # 纯英文数据，无需 BOM
  export_encoding: "utf-8"

split:
  test_size: 0.1
  val_size: 0.1
  seed: 42
  stratify: true

model:
  # 与 chinese-bert-wwm 同为 BERT-base（12 层 / 768 隐层 / 110M 参数）
  pretrained_path: "../../../NLP_learn10_12/PretrainedModel/bert-base-uncased"
  max_length: 256
  dropout: null

training:
  # 与中文模型目录分开，避免产物互相覆盖
  output_root: "../../model_imdb"
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  learning_rate: 2.0e-5
  num_train_epochs: 2
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  use_cpu: false
  seed: 42
  # 数据量大，日志稀疏一些，避免刷屏
  logging_steps: 200
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 1
  load_best_model_at_end: true
  dataloader_num_workers: 0
  gradient_accumulation_steps: 1
  report_to: []

tasks:
  single:
    output_dir: "single_label"
    metric_for_best_model: "macro_f1"
    greater_is_better: true
    top_k: 3
  multi:
    output_dir: "multi_label"
    metric_for_best_model: "macro_f1"
    greater_is_better: true
    threshold: 0.5

optimization:
  output_dir: "optimized"
  dtypes: ["fp16", "bf16"]
  int8_dynamic: true
  unstructured_ratios: [0.3, 0.5]
  structured_keep_ratios: [0.75, 0.5]
  low_rank_ratios: [0.75, 0.5, 0.25]
  eval_batch_size: 64
  latency_batch_size: 8
  latency_samples: 512
  latency_single_samples: 64
  latency_rounds: 3
  max_test_samples: null
  report_path: "../model_imdb_optimization_report.md"
  results_path: "../../model_imdb/optimization_results.json"
