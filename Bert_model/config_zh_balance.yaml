# =====================================================================
# 中文平衡电影类型分类（chinese-bert-wwm，10 类均衡）
# 说明：
#   * 数据源：original_file/data_balance.tsv（genre + summary，每类 10,000 条）
#   * 每行只有一个类型，只训练单标签任务
#   * 与旧中文配置隔离：独立输出目录、独立切分文件
# =====================================================================

data:
  source: "text"
  # 相对项目根目录（Bert_model/）
  path: "../original_file/data_balance.tsv"
  display_name: "中文平衡电影数据（10 类）"
  encoding: "utf-8"
  # TSV 分隔符
  separator: "\t"
  has_header: true
  columns: ["genre", "summary"]
  label_column: "genre"
  text_column: "summary"
  # 每行一个类型，primary 即可；不做多类型展开
  single_label_strategy: "primary"
  min_label_count: 10
  drop_duplicated: true
  # 同一摘要对应不同类别的样本整组剔除，避免矛盾监督
  drop_conflicting_labels: true
  # 中文摘要内部整段重复仅约 0.01%，无需去重
  dedupe_repeated_text: false
  missing_text: ""
  limit: null
  export_splits: true
  export_dir: "dataset/zh_balance_splits"
  export_encoding: "utf-8-sig"

split:
  test_size: 0.1
  val_size: 0.1
  seed: 42
  stratify: true

model:
  pretrained_path: "../../../NLP_learn10_12/PretrainedModel/chinese-bert-wwm"
  # P90 长度 368，384 可覆盖约 90% 样本
  max_length: 384
  dropout: null

training:
  # 与旧中文模型目录分开，保留旧产物便于对比
  output_root: "../../model_zh_balance"
  # 384 长度下 batch 16 更稳，避免 8GB 显存溢出
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 2.0e-5
  # 轮次上限放宽，是否继续由早停决定
  num_train_epochs: 12
  early_stopping_patience: 3
  weight_decay: 0.01
  optim: "adamw_torch_fused"
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  use_cpu: false
  seed: 42
  logging_steps: 100
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 1
  load_best_model_at_end: true
  dataloader_num_workers: 0
  gradient_accumulation_steps: 1
  report_to: []

tasks:
  single:
    output_dir: "single_label"
    metric_for_best_model: "macro_f1"
    greater_is_better: true
    top_k: 3
  # 本数据集每行仅一个类型，不训练多标签；保留定义以满足配置校验
  multi:
    output_dir: "multi_label"
    metric_for_best_model: "macro_f1"
    greater_is_better: true
    threshold: 0.5

optimization:
  output_dir: "optimized"
  dtypes: ["fp16", "bf16"]
  int8_dynamic: true
  unstructured_ratios: [0.3, 0.5]
  structured_keep_ratios: [0.75, 0.5]
  low_rank_ratios: [0.75, 0.5, 0.25]
  eval_batch_size: 32
  latency_batch_size: 8
  latency_samples: 512
  latency_single_samples: 64
  latency_rounds: 3
  max_test_samples: null
  report_path: "../model_zh_balance_optimization_report.md"
  results_path: "../../model_zh_balance/optimization_results.json"
