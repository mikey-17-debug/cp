<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>电影类型预测（LLM）</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 22px; }
        textarea { width: 100%; height: 140px; font-size: 14px; padding: 8px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
        #out { font-size: 20px; color: #c0392b; margin-top: 16px; }
        #dur { color: #555; font-size: 13px; margin-top: 6px; }
    </style>
</head>
<body>
<h1>大模型（DeepSeek）- 电影类型预测</h1>
<form id="f">
    <textarea name="text" placeholder="请输入电影片名 + 剧情简介"></textarea>
    <button type="submit">开始预测</button>
    <p id="out"></p>
    <p id="dur"></p>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const text = new FormData(e.target).get("text");
    const resp = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
    });
    const data = await resp.json();
    document.getElementById("out").textContent = data.pred_class || (data.result || "预测失败");
    document.getElementById("dur").textContent = data.duration ? `耗时 ${data.duration.toFixed(2)} 秒` : "";
};
</script>
</body>
</html>
